<section class="input-card" aria-labelledby="target-heading">
    @if(canCalculate){
    <div class="button-row calculate-row">
        <button type="button" class="calculate-button" (click)="calculate.emit()">
            Beste Punktzahl finden <span aria-hidden="true">→</span>
        </button>
        <button type="button" class="reset-button" (click)="reset.emit()">Neu starten</button>
    </div>
    }

    <div class="section-heading">
        <span class="step-number">02</span>
        <div>
            <h2 id="target-heading">Dein Ziel</h2>
            <p>Gib die Zahl ein, die du nahe erreichen willst</p>
        </div>
    </div>

    <div class="target-display" [class.has-value]="targetResult.length" aria-live="polite">
        <span class="value-label">ZIEL</span>
        <strong>{{targetResult || 'Zahl eingeben'}}</strong>
    </div>

    <div class="keypad target-keypad">
        @for(digit of keypadDigits; track digit){
        <button type="button" class="die-button" (click)="addDigit.emit(digit)">{{digit}}</button>
        }
    </div>

    @if(targetResult.length){
    <div class="button-row compact-actions">
        <button type="button" class="quiet-button" (click)="removeLast.emit()">Letzte löschen</button>
        <button type="button" class="quiet-button" (click)="clearAll.emit()">Ziel löschen</button>
    </div>
    }
</section>
